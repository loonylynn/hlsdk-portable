name: ragdoll authoring tools

on:
  push:
    paths:
      - 'tools/smd2jrag.py'
      - 'tools/jragtool.py'
      - 'tools/tests/**'
      - 'assets/valve/models/*.jrag'
      - 'assets/experimental/source-port-scientist/**'

      - '.github/workflows/ragdoll-tools.yml'
  pull_request:
    paths:
      - 'tools/smd2jrag.py'
      - 'tools/jragtool.py'
      - 'tools/tests/**'
      - 'assets/valve/models/*.jrag'
      - 'assets/experimental/source-port-scientist/**'

      - '.github/workflows/ragdoll-tools.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile authoring tools
        run: python -m py_compile tools/smd2jrag.py tools/jragtool.py
      - name: Run authoring tool tests
        run: python -m unittest discover -s tools/tests -v
      - name: Validate experimental Source-port Scientist fixture
        run: |
          python tools/jragtool.py validate \
            assets/experimental/source-port-scientist/scientist.jrag \
            assets/experimental/source-port-scientist/scientist.ragdoll.smd \
            --qci assets/experimental/source-port-scientist/scientist.ragdoll.qci
