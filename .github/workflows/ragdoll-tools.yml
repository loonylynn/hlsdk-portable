name: ragdoll authoring tools

on:
  push:
    paths:
      - 'tools/smd2jrag.py'
      - 'tools/tests/**'
      - '.github/workflows/ragdoll-tools.yml'
  pull_request:
    paths:
      - 'tools/smd2jrag.py'
      - 'tools/tests/**'
      - '.github/workflows/ragdoll-tools.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile converter
        run: python -m py_compile tools/smd2jrag.py
      - name: Run converter tests
        run: python -m unittest discover -s tools/tests -v
